<!DOCTYPE html>
<html lang="en">
<head>
    <link href="style.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - PharmaLink</title>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="Logo">
            <img src="LOGO AND BACKGROUND IMAGES/Pharmalink logo.png" alt="PharmaLink Logo" width="200">
        </div>

        <!-- Navigation -->
    <div class="nav">
        <a href="index.html">Home</a>
        <a href="About Us.html">About Us</a>
        <a href="Products.html">Products</a>
        <a href="Services.html">Services</a>
        <a href="Cart.html">Cart</a>
    </div>
    </div>

    <!-- Hero / Banner -->
    <div class="banner">
        <h1>YOUR CART</h1>
        <p>Review your selected items before checkout.</p>
    </div>

    <!-- Cart Table -->
    <table class="cart-table" id="cartTable">
        <tr>
            <th>PRODUCT</th>
            <th>QUANTITY</th>
            <th>PRICE (P)</th>
            <th>TOTAL (P)</th>
            <th>REMOVE</th>
        </tr>
        <tbody id="cartBody">
            <!-- Items inserted by JavaScript -->
        </tbody>
    </table>

    <!-- Empty Cart Message -->
    <div id="emptyMsg" style="display:none; text-align:center; padding:40px; color:#555;">
        <p style="font-size:1.1rem;">Your cart is empty. <a href="Products.html" style="color:#198754; font-weight:600;">Browse Products</a></p>
    </div>

    <!-- Cart Summary -->
    <div class="cart-summary" id="cartSummary">
        <h3>Total Price: P <span id="grandTotal">0.00</span></h3>
        <div>
            <button onclick="window.location.href='Products.html'">CONTINUE SHOPPING</button>
            <button onclick="window.location.href='Checkout.html'">PROCEED TO CHECKOUT</button>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        COPYRIGHT &copy; 2026 PharmaLink. All rights reserved.
    </div>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem('pharmaCart')) || [];
            const tbody = document.getElementById('cartBody');
            tbody.innerHTML = '';

            if (cart.length === 0) {
                document.getElementById('emptyMsg').style.display = 'block';
                document.getElementById('cartSummary').style.display = 'none';
                document.getElementById('cartTable').style.display = 'none';
                return;
            }

            document.getElementById('emptyMsg').style.display = 'none';
            document.getElementById('cartSummary').style.display = 'flex';
            document.getElementById('cartTable').style.display = 'table';

            let grandTotal = 0;

            cart.forEach((item, index) => {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td class="product-info"><span>${item.name}</span></td>
                    <td>
                        <button onclick="changeQty(${index}, -1)">-</button>
                        <span class="qty">${item.qty}</span>
                        <button onclick="changeQty(${index}, 1)">+</button>
                    </td>
                    <td class="price">${item.price.toFixed(2)}</td>
                    <td class="total">${item.total.toFixed(2)}</td>
                    <td><button onclick="removeItem(${index})" style="background-color:#dc3545;">✕</button></td>
                `;
                tbody.appendChild(row);
                grandTotal += item.total;
            });

            document.getElementById('grandTotal').textContent = grandTotal.toFixed(2);
        }

        function changeQty(index, change) {
            let cart = JSON.parse(localStorage.getItem('pharmaCart')) || [];
            cart[index].qty += change;
            if (cart[index].qty < 1) cart[index].qty = 1;
            cart[index].total = cart[index].qty * cart[index].price;
            localStorage.setItem('pharmaCart', JSON.stringify(cart));
            loadCart();
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('pharmaCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('pharmaCart', JSON.stringify(cart));
            loadCart();
        }

        // Load cart on page load
        loadCart();
    </script>

</body>
</html>
