<!DOCTYPE html>
<html lang="en">
<head>
    <link href="style.css" rel="stylesheet">
    <script src="script.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - PharmaLink</title>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="Logo">
            <img src="LOGO AND BACKGROUND IMAGES/Pharmalink logo.png" alt="PharmaLink Logo" width="200">
        </div>
    </div>

    <!-- Navigation -->
    <div class="nav">
        <a href="index.html">Home</a>
        <a href="About Us.html">About Us</a>
        <a href="Products.html">Products</a>
        <a href="Services.html">Services</a>
        <a href="Cart.html">Cart</a>
    </div>

    <!-- Hero / Banner -->
    <div class="banner">
        <h1>CHECKOUT</h1>
    </div>

    <!-- Customer Details -->
    <div class="Customer-details">
        <h3>CUSTOMER DETAILS</h3>

        <div class="form-group">
            <label>FULL NAME</label>
            <input type="text" id="fullName" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label>PHONE NUMBER</label>
            <input type="text" id="phone" placeholder="e.g. 71234567">
        </div>

        <div class="form-group">
            <label>ADDRESS</label>
            <input type="text" id="address" placeholder="Enter your delivery address">
        </div>
    </div>

    <!-- Delivery / Pickup Option -->
    <div class="Delivery">
        <div class="delivery-options">
            <h4>DELIVERY / PICKUP OPTION</h4>
            <label>
                <input type="radio" name="option" value="Delivery" checked> DELIVERY
            </label>
            <label>
                <input type="radio" name="option" value="Pickup"> PICKUP
            </label>
        </div>
    </div>

    <!-- Order Summary -->
    <div class="Summary">
        <div class="box">
            <h4>ORDER SUMMARY</h4>
            <div id="orderSummary">
                <!-- Items inserted by JavaScript -->
            </div>
            <div class="order-total">
                <span>TOTAL</span>
                <span>P <span id="checkoutTotal">0.00</span></span>
            </div>
        </div>
    </div>

    <!-- Place Order Button -->
    <button class="btn" onclick="placeOrder()">PLACE ORDER</button>

    <!-- Footer -->
    <div class="footer">
        COPYRIGHT &copy; 2026 PharmaLink. All rights reserved.
    </div>

</body>
</html>
