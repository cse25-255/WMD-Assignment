<!DOCTYPE html>
<html lang="en">
<head>
    <link href="style.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - PharmaLink</title>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="Logo">
            <img src="LOGO AND BACKGROUND IMAGES/Pharmalink logo.png" alt="PharmaLink Logo" width="200">
        </div>
        <!-- Navigation -->
    <div class="nav">
        <a href="index.html">Home</a>
        <a href="About Us.html">About Us</a>
        <a href="Products.html">Products</a>
        <a href="Services.html">Services</a>
        <a href="Cart.html">Cart</a>
    </div>

    </div>

    <!-- Hero / Banner -->
    <div class="Hero">
        <h1>BOOK A SERVICE</h1>
    </div>

    <!-- Booking Form -->
    <div class="Customer-details">
        <h3>YOUR DETAILS</h3>

        <div class="form-group">
            <label>FULL NAME</label>
            <input type="text" id="fullName" placeholder="Enter your full name">
        </div>

        <div class="form-group">
            <label>PHONE NUMBER</label>
            <input type="text" id="phone" placeholder="e.g. 71234567">
        </div>

        <div class="form-group">
            <label>SERVICE</label>
            <select id="service" style="width:100%; padding:10px 14px; border:1px solid #ccc; border-radius:8px; font-size:0.95rem;">
                <option value="">-- Select a Service --</option>
                <option value="HIV Testing">HIV Testing</option>
                <option value="Blood Pressure Check">Blood Pressure Check</option>
                <option value="Pregnancy Scan">Pregnancy Scan</option>
                <option value="Diabetes Screening">Diabetes Screening</option>
                <option value="Vaccination">Vaccination</option>
                <option value="Cholesterol Test">Cholesterol Test</option>
                <option value="Pharmacist Consultation">Pharmacist Consultation</option>
                <option value="Weight Management">Weight Management</option>
            </select>
        </div>

        <div class="form-group">
            <label>PREFERRED DATE</label>
            <input type="date" id="bookingDate">
        </div>

        <div class="form-group">
            <label>PREFERRED TIME</label>
            <input type="time" id="bookingTime">
        </div>

        <div class="form-group">
            <label>ADDITIONAL NOTES (optional)</label>
            <textarea id="notes" placeholder="Any special instructions or concerns..." 
                style="width:100%; padding:10px 14px; border:1px solid #ccc; border-radius:8px; font-size:0.95rem; resize:vertical; min-height:80px;"></textarea>
        </div>
    </div>

    <!-- Submit Button -->
    <button class="btn" onclick="submitBooking()">CONFIRM BOOKING</button>

    <!-- Footer -->
    <div class="footer">
        COPYRIGHT &copy; 2026 PharmaLink. All rights reserved.
    </div>

    <script>
        // Pre-fill service if coming from Services page
        window.onload = function () {
            const preSelected = localStorage.getItem('bookingService');
            if (preSelected) {
                const select = document.getElementById('service');
                for (let option of select.options) {
                    if (option.value === preSelected) {
                        option.selected = true;
                        break;
                    }
                }
                localStorage.removeItem('bookingService');
            }
        };

        function submitBooking() {
            const name = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const service = document.getElementById('service').value;
            const date = document.getElementById('bookingDate').value;
            const time = document.getElementById('bookingTime').value;

            if (!name || !phone || !service || !date || !time) {
                alert('Please fill in all required fields before confirming your booking.');
                return;
            }

            alert('✅ Booking confirmed!\n\nName: ' + name + '\nService: ' + service + '\nDate: ' + date + '\nTime: ' + time + '\n\nWe will contact you at ' + phone + ' to confirm your appointment.');

            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
